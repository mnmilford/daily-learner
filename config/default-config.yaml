timezone: "America/Chicago"

sources:
  memory_dir: "~/.openclaw/workspace/memory"
  memory_pattern: "{date}.md"
  openclaw_log_dir: "/tmp/openclaw"
  openclaw_log_pattern: "openclaw-{date}.log"
  session_dir: "~/.openclaw/agents/main/sessions"
  session_index: "~/.openclaw/agents/main/sessions/sessions.json"

llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  api_key_source: "openclaw_config"  # reads from ~/.openclaw/openclaw.json env.GEMINI_API_KEY
  max_input_tokens: 8000
  max_output_tokens: 4000
  temperature: 0.7
  thinking_budget: 0

pipeline:
  topics_per_day: 7
  bonus_ratio: 0.3        # ~30% bonus/related topics injected
  flashcards_per_topic: 1
  multiple_choice_per_topic: 1
  short_answer_per_topic: 1
  questions_per_topic: 1   # legacy alias for short_answer_per_topic
  challenges_per_batch: 1

review:
  new_ratio: 0.60
  review_ratio: 0.25
  bonus_ratio: 0.15
  spacing_intervals: [1, 3, 7, 14, 30]
  graduation_threshold: 3   # times reviewed at confidence 5
  low_confidence_cutoff: 2   # resets to interval[0]

learner:
  default_persona: "lil-mike"
  default_difficulty_level: "follow-if-slowed-down"
  default_evaluation_mode: "off"
  adaptive_window: 10
  adaptive_min_answers: 8
  adaptive_history_limit: 60
  adaptive_cooldown_answers: 8
  adaptive_promote_threshold: 4.4
  adaptive_demote_threshold: 2.4
  adaptive_promote_strong_streak: 3
  adaptive_demote_weak_streak: 3
  adaptive_promote_min_high_mastery: 5
  adaptive_demote_min_low_mastery: 4
  adaptive_promote_max_incorrect: 1

data_dir: "~/.daily-learner"
